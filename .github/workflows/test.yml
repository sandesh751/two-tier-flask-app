          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/sandeshsaini7983637650/github
            git pull origin main
            docker compose -d --build
          
      
