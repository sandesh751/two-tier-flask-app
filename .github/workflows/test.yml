name: test-deployment

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v1
      - name: ssh-to-vm
        uses: appleboy/ssh-action@v1.0.3
