name: test-deployment

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Google Cloud ke sath secure connection banana
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Bina manually key manage kiye GCP VM par command chalana
      - name: Deploy to GCP VM via Google SSH
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: instance-20260826-152012  # <-- Apne VM ka exact naam check kar lein
          zone: us-central1-a                        # <-- Apne VM ka sahi Zone dalein (jaise us-central1-a, asia-south1-a)
          ssh_private_key: ${{ secrets.KEY }}        # Aapki banayi hui private key
          command: |
            # 1. Sudo ka use karke force-entry karein sahi folder mein
            sudo bash -c "cd /home/sandeshsaini7983637650/github || cd /root/github"
            
            # 2. Poore block ko sudo ke andar chalayein taaki permission na ruke
            sudo bash -c "
              cd /home/sandeshsaini7983637650/github || cd /root/github
              git reset --hard origin/main
              git config pull.rebase false
              git pull origin main
              docker compose up -d --build
            "


      
